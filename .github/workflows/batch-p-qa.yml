name: Batch P — historical corpus and desktop-mobile reading
on:
  push:
    branches:
      - feat/batch-p-paleolithic-modern-economy
  pull_request:
    paths:
      - 'data/articles/**'
      - 'scripts/**'
      - 'content/atlas/**'
      - 'tests/**'
      - '.github/workflows/batch-p-qa.yml'
jobs:
  historical-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build readonly public distribution
        run: python scripts/build_release.py
      - name: Verify canonical preservation and narrative count
        run: python tests/batch_p_pipeline.py
      - name: Check browser scripts
        run: |
          node --check app.js
          node --check exploration.js
          node --check content-platform.js
          node --check reader-window.js
      - name: Install open-source Chromium test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate desktop and mobile reading journeys
        run: python tests/batch_p_journeys.py
      - name: Real Cloudflare branch-preview desktop/mobile acceptance
        env:
          KOREA_PREVIEW_URL: https://feat-batch-p-paleolithic-mod.korea-eo3.pages.dev
        run: python tests/batch_p_preview.py
