name: Batch S — Joseon Economy and Democratization Historical Corpus QA
on:
  push:
    branches:
      - feat/batch-s-joseon-economy-democratization
  pull_request:
    paths:
      # Historical fixture is pinned to Batch S and must not block subsequent additive batches.
      - 'data/articles/VII.6.*.json'
      - 'data/articles/IX.4.*.json'
      - 'tests/batch_s_*'
      - 'tests/fixtures/batch_s_*'
      - '.github/workflows/batch-s-qa.yml'
jobs:
  historical-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build allowlisted production release
        run: python scripts/build_release.py
      - name: Validate canonical hashes, article preservation, words and content pack integrity
        run: python tests/batch_s_pipeline.py
      - name: Syntax check application scripts
        run: |
          node --check app.js
          node --check exploration.js
          node --check content-platform.js
          node --check reader-window.js
      - name: Install Chromium browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run exact-head desktop/mobile generated-asset journeys
        run: python tests/batch_s_journeys.py
      - name: Run actual Cloudflare Pages preview desktop/mobile journeys
        env:
          KOREA_PREVIEW_URL: https://feat-batch-s-joseon-economy-.korea-eo3.pages.dev
        run: python tests/batch_s_preview.py
